
name: ai-survival-world

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-survival-world:latest
    restart: always
    init: true
    stop_grace_period: 30s

    ports:
      - "8080:8080"

    environment:
      NODE_ENV: production
      PORT: "8080"
      MP_STATE_FILE: /data/world-state.json

      # VIVES LLM configuration
      VIVES_LLM_URL: ${VIVES_LLM_URL:-https://api.llm.mechatronics.be/v1}
      VIVES_MODEL: ${VIVES_MODEL:-qwen3.8-27b}
      VIVES_LLM_KEY: ${VIVES_LLM_KEY:-}

      # NPC configuration
      NPC_CHAT_COOLDOWN_MS: ${NPC_CHAT_COOLDOWN_MS:-3000}
      NPC_MAX_CONTEXT_MESSAGES: ${NPC_MAX_CONTEXT_MESSAGES:-20}

      # World simulation pacing
      TIME_SYNC_MS: ${TIME_SYNC_MS:-2000}
      BUSH_REGROW_MS: ${BUSH_REGROW_MS:-90000}

    volumes:
      # Persistent world data: buildings, harvests, clock and player profiles
      - world-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  world-data:
    external: true
    name: ai-survival-world-data
